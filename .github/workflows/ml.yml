name: ml

on:
  push:
    paths:
      - "ml/**"
      - "contracts/**"
      - ".github/workflows/ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - "contracts/**"
      - ".github/workflows/ml.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]" || pip install -e .

      # TODO: replace with `pytest` once tests exist
      - name: Lint/test (placeholder)
        run: python -c "print('ml CI placeholder')"

name: firmware

on:
  push:
    paths:
      - "firmware/**"
      - "contracts/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "firmware/**"
      - "contracts/**"
      - ".github/workflows/firmware.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # PlatformIO has no per-environment src_dir option, so each of
        # these 3 sketches is its own self-contained PlatformIO project
        # (see firmware/nodes/node_with_rtc/platformio.ini for why).
        sketch:
          - firmware/nodes/node_with_rtc
          - firmware/nodes/node_no_rtc
          - firmware/hub
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build ${{ matrix.sketch }}
        working-directory: ${{ matrix.sketch }}
        run: pio run

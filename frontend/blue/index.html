<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DryAhead – senzory, ktoré počujú smäd pôdy</title>
    <meta name="description" content="Sieť lacných senzorov pôdnej vlhkosti pri Zvolene: zalievať len vtedy, keď to pôda naozaj potrebuje, a zachrániť mladé stromy skôr, než uschnú." />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1a16" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="sk_SK" />
    <meta property="og:site_name" content="DryAhead" />
    <meta property="og:title" content="DryAhead – senzory, ktoré počujú smäd pôdy" />
    <meta property="og:description" content="Zalievať len vtedy, keď to pôda naozaj potrebuje, a zachrániť mladé stromy skôr, než uschnú. Projekt do Blue Challenge 2026." />
    <meta property="og:url" content="__SITE_URL__/blue/" />
    <meta property="og:image" content="__SITE_URL__/blue/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="DryAhead: prierez pôdou so stromom, koreňmi a senzorom vlhkosti" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/blue/favicon.svg" type="image/svg+xml" />

    <!-- Theme before first paint: saved choice, else the system setting. -->
    <script>
      try {
        var t = localStorage.getItem('dryahead-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding:1rem;font-family:system-ui">DryAhead: sieť senzorov pôdnej vlhkosti pri Zvolene. Pre interaktívne grafy zapnite JavaScript.</p>
    </noscript>
    <script type="module" src="/src/blue/main.jsx"></script>
  </body>
</html>

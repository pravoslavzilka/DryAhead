; Self-contained PlatformIO project for this one sketch. src_dir points at
; this same folder (PlatformIO has no per-environment src_dir option; a
; single project-wide platformio.ini covering all 3 firmware/ sketches was
; tried and does not work - build_src_filter cannot reliably escape the
; default src_dir upward). Verified with `pio run` before commit.

[platformio]
src_dir = .

[env:node_with_rtc]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps =
	sandeepmistry/LoRa@0.8.0
	adafruit/RTClib@2.1.4
	adafruit/Adafruit BusIO@1.17.4
